spring.config.import=optional:file:.env[.properties]

spring.application.name=insurance-fraud-backend
server.port = ${SERVER_PORT:8081}
server.address=0.0.0.0

# DATABASE (Defaults to Localhost MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/insurance_fraud_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# AI MICROSERVICE
ai.fraud.service.url=${AI_SERVICE_URL:http://localhost:8000/api/v1/analyze-claim}
ai.fraud.service.internal-key=${AI_FRAUD_SERVICE_INTERNAL_KEY:}

# RABBITMQ CONFIG
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

rabbitmq.exchange.events=fraudguard.events
rabbitmq.queue.claim.analysis=fraudguard.claim.analysis
rabbitmq.claim.analysis.dlx=fraudguard.claim.analysis.dlx
rabbitmq.queue.notify.push=fraudguard.notify.push

# Routing Keys
rabbitmq.routing.key.claim.analysis=claim.submitted
rabbitmq.routing.key.notify.push=notify.push

# Consumer Retry Policy (3 attempts with exponential backoff: 5s, 15s, 45s)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.retry.multiplier=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# MAIL CONFIG
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:test@example.com}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

# JWT
jwt.secret=${JWT_SECRET:4F8xK9mP2QaL7vBn3TzW6HsY1DcR5EfU8JiN0KoLpXc}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:15m}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:7d}

# FILE UPLOAD CONFIG (10MB unified policy)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Local development folder
file.upload-dir=./images

# STORAGE PROVIDER (local or cloudinary)
storage.provider=${STORAGE_PROVIDER:local}


